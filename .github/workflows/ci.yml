name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install from lockfile
        run: uv sync --frozen --extra dev
      - name: ruff check
        run: uv run ruff check gtm tests backend

  cli:
    name: CLI / engine (gtm) — pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from lockfile
        run: uv sync --frozen --extra dev
      - name: Run tests
        run: uv run pytest -q

  backend:
    name: Backend API (Django)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install engine + backend from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r backend/requirements.lock
      - name: Django tests
        working-directory: backend
        run: python manage.py test

  frontend:
    name: Frontend build (React/Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install + build
        working-directory: frontend
        run: |
          npm ci
          npm run build
